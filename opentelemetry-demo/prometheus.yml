global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: '/metrics'

  - job_name: 'lower-service'
    static_configs:
      - targets: ['lower:5053']
    metrics_path: '/metrics'

  - job_name: 'upper-service'
    static_configs:
      - targets: ['upper:5054']
    metrics_path: '/metrics'

  - job_name: 'digit-service'
    static_configs:
      - targets: ['digit:5051']
    metrics_path: '/metrics'

  - job_name: 'special-service'
    static_configs:
      - targets: ['special:5052']
    metrics_path: '/metrics'

  - job_name: 'generator-service'
    static_configs:
      - targets: ['generator:5050']
    metrics_path: '/metrics'
